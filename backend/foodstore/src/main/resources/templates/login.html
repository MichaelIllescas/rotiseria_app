<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FoodStore - Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
<div class="nature-background">
    <div class="floating-leaf leaf-1"></div>
    <div class="floating-leaf leaf-2"></div>
    <div class="floating-leaf leaf-3"></div>
    <div class="floating-leaf leaf-4"></div>
</div>
<div class="login-container">
    <div class="wellness-card">
        <div class="organic-border"></div>

        <!-- Encabezado SIEMPRE visible -->
        <div class="mindful-header">
            <div class="zen-logo">
                <svg fill="none" height="56" viewBox="0 0 56 56" width="56">
                    <circle cx="28" cy="28" fill="none" opacity="0.6" r="26" stroke="currentColor" stroke-width="2"/>
                    <circle cx="28" cy="28" fill="none" opacity="0.8" r="18" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="28" cy="28" fill="currentColor" opacity="0.9" r="10"/>
                    <path d="M28 18v20M18 28h20" stroke="white" stroke-linecap="round" stroke-width="1.5"/>
                </svg>
                <div class="zen-glow"></div>
            </div>
            <h1>Bienvenido</h1>
            <p class="healing-link" id="showLogin">Iniciar sesión</p>
            <!-- Mensaje de error -->
            <div class="gentle-error" id="loginError"></div>
        </div>

        <!-- Formulario oculto al inicio -->
        <form class="harmony-form hidden" id="loginForm" novalidate th:action="@{/login}" th:method="post">
            <div class="organic-field">
                <div class="field-nature"></div>
                <input autocomplete="email" id="username" name="username" placeholder=" " required type="email">
                <label for="username">Email</label>
                <span class="gentle-error" id="emailError"></span>
            </div>

            <div class="organic-field">
                <div class="field-nature"></div>
                <input autocomplete="current-password" id="password" name="password" placeholder=" " required
                       type="password">
                <label for="password">Password</label>
                <button aria-label="Toggle password visibility" class="nature-toggle" id="passwordToggle" type="button">
                    <svg class="eye-visible" fill="none" height="20" viewBox="0 0 20 20" width="20">
                        <path d="M10 4c-4 0-7 3-8 6 1 3 4 6 8 6s7-3 8-6c-1-3-4-6-8-6zm0 10a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"
                              fill="currentColor"/>
                    </svg>
                    <svg class="eye-hidden" fill="none" height="20" viewBox="0 0 20 20" width="20">
                        <path d="M3 3l14 14M8.5 8.5a2 2 0 002.83 2.83m-.83-4.83a4 4 0 014 4M10 6C6 6 3 9 2 12c.5 1.5 2 3.5 4 4.5M10 14c4 0 7-3 8-6-.5-1.5-2-3.5-4-4.5"
                              stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                    </svg>
                </button>
                <span class="gentle-error" id="passwordError"></span>
            </div>

            <button class="harmony-button" type="submit">
                <div class="button-earth"></div>
                <span class="button-text">Ingresar</span>
            </button>
            <div class="balance-divider">
                <hr class="divider-branch divider-center">

            </div>


        </form>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
