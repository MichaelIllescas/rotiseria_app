<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperación de Contraseña</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f8f8; color: #333;">
<div style="max-width: 600px; margin: auto; padding: 20px; background: #fff;
            border-radius: 8px; border: 1px solid #eee;">
    <h2 style="color: #4CAF50; text-align: center;">Recuperación de Contraseña</h2>
    <p>Hola,</p>
    <p>Recibimos una solicitud para restablecer tu contraseña. Haz clic en el botón de abajo:</p>
    <p style="text-align: center;">
        <a th:href="${resetLink}" style="display: inline-block; padding: 10px 20px;
            background-color: #4CAF50; color: #fff; text-decoration: none;
            border-radius: 5px; font-weight: bold;">
            Restablecer Contraseña
        </a>
    </p>
    <p>Si no solicitaste este cambio, puedes ignorar este correo.</p>
    <hr/>
    <p style="font-size: 12px; color: #777; text-align: center;">
        © 2025 ImperialNet - Plataforma FoodStore
    </p>
</div>
</body>
</html>
